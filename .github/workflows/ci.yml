name: ci

# CI 는 타입 체크, 빌드, 링크 무결성을 검사합니다.
# 브라우저 검증(scripts/verify.sh)은 macOS WebKit 을 사용하므로 로컬에서 수행합니다.
# 근거: docs/spec/QA_AND_A11Y.md 3장

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 빌드와 링크 무결성
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 커밋 메시지 검사가 github.event.before 와 HEAD~1 을 참조하므로
          # 전체 이력을 받습니다(기본 fetch-depth 는 1).
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # scripts/verify.sh 8단계가 src/data/*.ts 를 직접 import 하므로
          # 타입 스트리핑이 필요합니다(Node 22.18.0 이상). package.json 의
          # engines.node 와 같은 하한을 씁니다. '22' 로 두면 부동 소수 버전이라
          # 하한을 충족하지 않는 러너에서 조용히 실패할 수 있습니다.
          node-version: '22.18.0'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 저장소 규칙 검사 (이모지 금지)
        run: npm run check:emoji

      - name: 커밋 메시지 형식 검사
        run: |
          # push: 이번 푸시 범위 커밋을 검사합니다.
          # pull_request: PR head 커밋 하나만 검사합니다.
          # workflow_dispatch: 직전 커밋 1개만 검사합니다.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            head="${{ github.event.pull_request.head.sha }}"
            range="${head}^..${head}"
          else
            base="${{ github.event.before }}"
            # 최초 푸시(all-zeros)와 수동 실행은 직전 커밋 1개만 검사합니다.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1..HEAD"
            else
              range="${base}..HEAD"
            fi
          fi
          failed=0
          while IFS= read -r sha; do
            msg=$(git log -1 --format=%B "$sha")
            tmpfile=$(mktemp)
            printf '%s' "$msg" > "$tmpfile"
            if ! node scripts/validate-commit-message.mjs "$tmpfile"; then
              echo "  -> 문제가 있는 커밋: $sha"
              failed=1
            fi
            rm -f "$tmpfile"
          done < <(git log --format=%H "$range")
          exit $failed

      - name: 타입 체크
        run: npm run check

      - name: 빌드
        run: npm run build

      - name: 링크 무결성
        run: npm run links

      - name: sitemap 무결성
        run: npm run check:sitemap

      # 4단계 정적 검사 4종 중 나머지 2종입니다. 2026-10-02 에 verify.sh 에 붙었지만
      # 여기에는 없었습니다. 둘 다 순수 Node 이므로 Linux 러너에서 그대로 돕니다.
      # check-structured-data 는 dist/ 를 읽으므로 위 빌드 뒤에 있어야 합니다.
      - name: 구조화 데이터 정합
        run: node scripts/check-structured-data.mjs dist

      - name: 카피 정합
        run: node scripts/check-copy-consistency.mjs .

      # 4단계 정적 검사에 2026-10-05 에 추가된 두 종류입니다. 둘 다 순수 Node 이고
      # dist/ 를 읽지 않으므로 빌드 전후와 무관하게 돕니다.
      # 4단계 정적 검사 6종이 됩니다.
      - name: 문서 상대 링크 무결성
        run: node scripts/check-doc-links.mjs

      - name: 페이지 목록 대조
        run: node scripts/check-pages-listed.mjs

      - name: 산출물 요약
        run: |
          echo "생성된 페이지:"
          find dist -name '*.html' | sort
          echo ""
          echo "번들 크기:"
          du -h dist/_astro/* | sort -h

      - name: 산출물 업로드
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
