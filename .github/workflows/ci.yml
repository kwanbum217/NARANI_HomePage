name: ci

# CI 는 타입 체크, 빌드, 링크 무결성을 검사합니다.
# 브라우저 검증(scripts/verify.sh)은 macOS WebKit 을 사용하므로 로컬에서 수행합니다.
# 근거: docs/spec/QA_AND_A11Y.md 3장

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 빌드와 링크 무결성
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # scripts/verify.sh 8단계가 src/data/*.ts 를 직접 import 하므로
          # 타입 스트리핑이 필요합니다(Node 22.18.0 이상). package.json 의
          # engines.node 와 같은 하한을 씁니다. '22' 로 두면 부동 소수 버전이라
          # 하한을 충족하지 않는 러너에서 조용히 실패할 수 있습니다.
          node-version: '22.18.0'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 저장소 규칙 검사 (이모지 금지)
        run: npm run check:emoji

      - name: 타입 체크
        run: npm run check

      - name: 빌드
        run: npm run build

      - name: 링크 무결성
        run: npm run links

      - name: 산출물 요약
        run: |
          echo "생성된 페이지:"
          find dist -name '*.html' | sort
          echo ""
          echo "번들 크기:"
          du -h dist/_astro/* | sort -h

      - name: 산출물 업로드
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
